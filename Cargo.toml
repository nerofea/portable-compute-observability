[workspace]
members = ["crates/pco-core", "crates/pco-runner", "crates/pco-cpu", "crates/pco-statistics", "crates/pco-memory"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
