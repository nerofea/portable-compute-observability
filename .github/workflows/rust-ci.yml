name: Rust CI
on:
  push:
    branches: [main, feat/apple-m5-benchmark-suite]
  pull_request:
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          components: clippy,rustfmt
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets
      - run: cargo run --release -p pco-runner -- run --suite apple-m5-smoke
